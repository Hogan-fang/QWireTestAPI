base_success:
  status: "SUCCESS"
  cardNumber: "$regex(^\\d{6}\\*+\\d{4}$)"
  products[0].productId: "$ref(request.products[0].productId)"

base_processing:
  extends: base_success
  products[0].status: "PROCESSING"

order_success:
  extends: base_processing
  eventType: "ORDER_SUCCESS"
  reference: "$ref(request.reference)"
  orderId: "$regex(^PX\\d+$)"
  amount: "$ref(request.amount)"
  currency: "$ref(request.currency)"

order_shipped:
  extends: base_success
  eventType: "ORDER_SHIPPED"
  reference: "$ref(request.reference)"
  orderId: "$regex(^PX\\d+$)"
  products[0].status: "SHIPPED"
