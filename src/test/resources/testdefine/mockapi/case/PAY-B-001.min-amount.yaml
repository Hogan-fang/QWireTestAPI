profile:
  name: PAY-B-001
  title: Create order with minimum amount
  type: single
  action: order.createOrder
  module: mockapi
  feature: create-order
  category: Boundary
  service: payment

data:
  ref:
    - file: $project/runtime/context/cards.yaml#paid
      to: value.card
    - file: $home/data/products.yaml#one
      to: value.products
  template:
    - file: $home/data/template/create-order.template.yaml
      to: request
  request:
    reference: PAY-B-001-{{runId}}
    merchantId: "{{context.mid}}"
    amount: 0.01
    currency: CAD

check:
  - name: transportCheck
    assertion:
      response.statusCode: "200"
