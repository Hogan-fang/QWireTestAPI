profile:
  name: PAY-E-002
  title: Create order rejects negative amount
  type: single
  action: order.createOrder
  module: mockapi
  feature: create-order
  category: Exception
  service: payment

data:
  ref:
    - file: $project/runtime/context/cards.yaml#paid
      to: value.card
    - file: $home/data/products.yaml#one
      to: value.products
  template:
    - file: $home/data/template/create-order.template.yaml
      to: request
  request:
    reference: PAY-E-002-{{runId}}
    merchantId: "{{context.mid}}"
    amount: -1
    currency: CAD

check:
  - name: transportCheck
    assertion:
      response.statusCode: "400"
