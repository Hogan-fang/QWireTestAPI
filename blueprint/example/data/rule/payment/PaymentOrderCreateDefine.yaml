caseName: PaymentOrderCreate
description: 订单支付接口测试数据生成规则。数据项应优先复用项目级预设类型，而不是在每个 dataset 中重复定义边界、极值、非法值。
schema: rule-data-define.schema.json

dataTypeCatalog:
  file: 
    - PaymentOrderDataTypes.yaml
  notes:
    - PAYMENT_AMOUNT 作为项目预设金额类型，集中维护边界值、极值与非法值
    - CARD_INFO 作为复合体类型，统一描述 cardNumber/cvv/expiry 的有效和无效组合
    - PRODUCT_SELECTION 作为产品集合类型，只能从允许的产品范围中选择，不随意生成规格和产品标识

sharedFields:
  - itemName: reference
    dataType: PAYMENT_REFERENCE
    required: "Y"
  - itemName: name
    dataType: PAYMENT_ORDER_NAME
    required: "Y"
  - itemName: callback
    dataType: PAYMENT_CALLBACK
    required: "Y"
  - itemName: currency
    dataType: PAYMENT_CURRENCY
    required: "Y"

dataSets:
  - name: valid_usd_single_product
    description: 生成标准成功支付请求，单商品、USD 币种。
    dataItems:
      - itemName: amount
        dataType: PAYMENT_AMOUNT
        required: "Y"
      - itemName: card
        dataType: CARD_INFO
        required: "Y"
      - itemName: products
        dataType: PRODUCT_SELECTION
        required: "Y"

  - name: valid_usd_multi_product
    description: 生成标准成功支付请求，多商品场景。
    dataItems:
      - itemName: name
        dataType: PAYMENT_ORDER_NAME
        required: "Y"
        prefix: "PAY-MULTI-"
      - itemName: amount
        dataType: int
        range: [100, 1000]
        valid:
          - 168.5
          - 288.0
        invalid:  
          - 0
          - 10000.001
          - "xx"
        required: "Y"
      - itemName: card
        dataType: CARD_INFO
        required: "Y"
        outputMapping:
          cardNumber: cardNumber
          cvv: cvv
          expiry: expiry
      - itemName: products
        dataType: PRODUCT_SELECTION
        required: "Y"

outputExample:
  - reference: "PAY-REF-8b7eb39f8838463d9038cf89"
    name: "PAY-ORDER-001"
    callback: "http://127.0.0.1:8100/callback"
    cardNumber: "5555555555554444"
    cvv: "123"
    expiry: "12/28"
    amount: 168.5
    currency: "USD"
    products:
      - productId: "PAY-SKU-01"
        count: 1
        spec: "std"