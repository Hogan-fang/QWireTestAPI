# Assertion expression catalog for 02-checker.
# NOTE: 本文件表达式已迁移到 blueprint/02-checker/spec/assertion-expression.spec.yaml 的 catalog 段，
# 后续以 spec 文件为准维护。
# Current runtime supports a subset of these functions; the rest are documented here as
# spec-level or extension-level expressions so the example can cover the full assertion surface.

equality_example:
  order.id: "ORD-20260513-0001"
  order.status: "PAID"
  order.amount: 188.0
  order.currency: "USD"

inequality_example:
  order.status: "$ne(FAIL)"
  order.currency: "$ne(EUR)"

range_example:
  order.amount: "$between(100, 500)"
  order.discountAmount: "$gt(0)"
  order.discountAmountUpper: "$lte(50)"

format_example:
  order.uuid: "$uuid"
  order.reference: "$regex(^ORD-\\d{8}-\\d{4}$)"
  order.createdAt: "$date(yyyy-MM-dd)"
  order.updatedAt: "$datetime(yyyy-MM-dd'T'HH:mm:ssXXX)"

contains_example:
  order.tags: "$contains(PAID)"
  order.tagsAll: "$containsAll(PAID,SHIPPED)"
  order.tagsAny: "$containsAny(PAID,CANCELLED)"
  order.customer: "$contains(name)"

existence_example:
  order.customer.name: "$exists"
  order.failReason: "$notExists"
  order.optionalNote: "$isNull"
  order.optionalStatus: "$notNull"

list_example:
  order.items: "$count(2)"
  order.items[0].sku: "$exists"
  order.items[*].sku: "$regex(^SKU-\\d{3}$)"
  "order.items[status=PAID].sku": "$exists"
  order.items[0].metadata.label: "standard"

aggregate_example:
  order.items[*].price: "$sum(188.0)"
  order.items[*].priceAverage: "$avg(94.0)"

timestamp_example:
  order.createdAt: "$before(2026-05-14T00:00:00Z)"
  order.updatedAt: "$after(2026-05-13T09:00:00Z)"
  order.expiresAt: "$between(2026-05-13T00:00:00Z, 2026-05-14T00:00:00Z)"

escape_example:
  order.specialLiteral: '$value("$xxxxx")'

nested_object_example:
  order.customer.id: "CUST-001"
  order.customer.profile.name: "Alice"
  order.customer.profile.contact.email: "$regex(^[^@]+@[^@]+\\.[^@]+$)"
  order.customer.profile.address.city: "Shenzhen"

path_and_array_example:
  order.id: "$ref(request.order.id)"
  order.items[0].productId: "$ref(request.items[0].productId)"
  order.items[*].productId: "$exists"
  order.items[*].attributes[0].key: "$exists"