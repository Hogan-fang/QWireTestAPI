order_success:
  eventType: "ORDER_SUCCESS"
  reference: "$ref(request.reference)"
  orderId: "$regex(^PX\\d+$)"
  amount: "$ref(request.amount)"
  currency: "$ref(request.currency)"
  status: "SUCCESS"
  cardNumber: "$regex(^\\d{6}\\*+\\d{4}$)"
  products[0].productId: "$ref(request.products[0].productId)"
  products[0].count: "$ref(request.products[0].count)"
  products[0].spec: "$ref(request.products[0].spec)"
  products[0].status: "PROCESSING"

order_shipped:
  eventType: "ORDER_SHIPPED"
  reference: "$ref(request.reference)"
  orderId: "$regex(^PX\\d+$)"
  status: "SUCCESS"
  products[0].productId: "$ref(request.products[0].productId)"
  products[0].status: "SHIPPED"

order_delivered:
  eventType: "ORDER_DELIVERED"
  reference: "$ref(request.reference)"
  orderId: "$regex(^PX\\d+$)"
  status: "$in(SUCCESS,COMPLETED)"
  products[0].productId: "$ref(request.products[0].productId)"
  products[0].status: "DELIVERED"

order_completed:
  eventType: "ORDER_COMPLETED"
  reference: "$ref(request.reference)"
  orderId: "$regex(^PX\\d+$)"
  status: "COMPLETED"
  products[0].productId: "$ref(request.products[0].productId)"
  products[0].status: "DELIVERED"
