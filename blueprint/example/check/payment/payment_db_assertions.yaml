order_success_created:
  reference: "$ref(request.reference)"
  order_id: "$regex(^PX\\d+$)"
  name: "$ref(request.name)"
  callback_url: "$ref(request.callback)"
  amount: "$ref(request.amount)"
  currency: "$ref(request.currency)"
  status: "SUCCESS"
  failReason: "$isNull"
  card_number: "$regex(^\\d{6}\\*+\\d{4}$)"

product_processing:
  product_id: "$ref(request.products[0].productId)"
  count: "$ref(request.products[0].count)"
  spec: "$ref(request.products[0].spec)"
  status: "PROCESSING"

order_fail_created:
  reference: "$ref(request.reference)"
  order_id: "$regex(^PX\\d+$)"
  name: "$ref(request.name)"
  amount: "$ref(request.amount)"
  currency: "$ref(request.currency)"
  status: "FAIL"
  failReason: "Unsupported card type"
  card_number: "$regex(^\\d{6}\\*+\\d{4}$)"

product_fail:
  product_id: "$ref(request.products[0].productId)"
  count: "$ref(request.products[0].count)"
  spec: "$ref(request.products[0].spec)"
  status: "FAIL"

product_shipped:
  order_status: "SUCCESS"
  product_id: "$ref(request.products[0].productId)"
  product_status: "SHIPPED"

product_delivered:
  order_status: "$in(SUCCESS,COMPLETED)"
  product_id: "$ref(request.products[0].productId)"
  product_status: "DELIVERED"

order_completed:
  status: "COMPLETED"
