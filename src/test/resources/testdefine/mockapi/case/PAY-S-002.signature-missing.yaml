profile:
  name: PAY-S-002
  title: Missing signature should be rejected
  type: single
  action: order.createOrder
  module: mockapi
  feature: create-order
  category: Security
  status: draft-manual
  service: payment

data:
  ref:
    - file: $project/runtime/context/cards.yaml#paid
      to: value.card
    - file: $home/data/products.yaml#one
      to: value.products
  template:
    - file: $home/data/template/create-order.template.yaml
      to: request
  request:
    reference: PAY-S-002-{{runId}}
    merchantId: "{{context.mid}}"
    amount: 120.0
    currency: CAD

check:
  - name: transportCheck
    assertion:
      response.statusCode: "401"
