profile:
  name: PAY-S-004
  title: Database stores masked card and excludes sensitive fields
  type: single
  action: order.createOrder
  module: mockapi
  feature: create-order-db
  category: Security
  status: optional-db
  service: payment

data:
  ref:
    - file: $project/runtime/context/cards.yaml#paid
      to: value.card
    - file: $home/data/products.yaml#one
      to: value.products
  template:
    - file: $home/data/template/create-order.template.yaml
      to: request
  request:
    reference: PAY-S-004-{{runId}}
    merchantId: "{{context.mid}}"
    amount: 120.0
    currency: CAD

check:
  - name: transportCheck
    assertion:
      response.statusCode: "200"
  - name: dbCheck
    param:
      datasource: localDb
      sqlFile: src/test/resources/testdefine/mockapi/sql/mockapi-order.sql#findOrderByReference
    assertion:
      $rowCount: "$eq: 1"
      card_number_masked: "$exists"
