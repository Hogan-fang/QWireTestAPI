profile:
  name: PAY-N-001
  title: Create order succeeds
  type: single
  action: order.createOrder
  module: mockapi
  feature: create-order
  category: Normal
  service: payment

data:
  ref:
    - file: $project/runtime/context/cards.yaml#paid
      to: value.card
    - file: $home/data/products.yaml#one
      to: value.products
  template:
    - file: $home/data/template/create-order.template.yaml
      to: request
  request:
    reference: PAY-N-001-{{runId}}
    merchantId: "{{context.mid}}"
    amount: 120.0
    currency: CAD

check:
  - name: transportCheck
    assertion:
      response.statusCode: "200"
  - name: jsonResponseCheck
    assertion:
      orderId: "$exists"
      reference: "$eq: request.reference"
      merchantId: "$eq: request.merchantId"
      paymentStatus: "$eq: PAID"
