profile:
  name: callback_example
  title: Callback checker example
  type: single
  module: checker
  feature: callback
  priority: P1
  status: ready
  description: 最小数据的 Callback 检查器示例，展示全部回调检查参数。

data:
  value:
    request:
      reference: "CB-REF-001"
      callback: "http://127.0.0.1:8100/callback"

check:
  callbackCheck:
    name: callback_full_example
    assertion:
      $ref: ../../check/payment/payment_callback_assertions.yaml#order_success
    params:
      source: callback.payload
    mergeMode: FULL_MERGE
    source: callback.payload
    timeUnit: second
    wait: 10
    interval: 2
