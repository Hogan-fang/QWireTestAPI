profile:
  name: http_code_example
  title: HTTP content checker example
  type: single
  module: checker
  feature: http
  priority: P1
  status: ready
  description: 最小数据的 HTTP 内容检查器示例，展示状态码、响应头、content-type、响应时间、协议状态与断言参数。

data:
  value:
    request:
      reference: "HTTP-REF-001"

check:
  HTTPCode:
    statusCode: "200"
    headers:
      Content-Type: "application/json"
      X-Trace-Id: "$regex(^[A-Za-z0-9-]+$)"
    contentType: "application/json"
    responseTimeMs: 500
    protocolState: "HTTP"
    assertion:
      $ref: ../../check/payment/payment_response_assertions.yaml#single_success
      body.message: "OK"
      body.success: true
    params:
      source: response.body
