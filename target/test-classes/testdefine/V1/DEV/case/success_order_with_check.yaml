import: frag_order_data.yaml
name: pay order 
desc: This is a normal share

check:
  HTTPCode: "200"

  # callbackCheck example (flat JSON fields only in current implementation)
  # callbackCheck:
  #   id: "@id"
  #   status: "SUCCESS"
  #   amount: "100"
  #
  # callbackCheck from external file (resolved by configDir):
  # callbackCheck: callback_expect.json
  
  value:
    - root:
        - profitType: share
          reference: "@request.reference"
          orderId: ^333
          state: processing
          currency: CAD
    - products:
        - result: pending
          createdAt: now
 
  assert:
      mustExist:
        - path: products
          exist: 
            - productId
            
      mustNotExist:
        - items:
            - errorCode
        - path: products
          items: 
            - stock
            
  dbcheck:
    - name: check_order
      sql: "select id, reference, state, currency from orders where reference='@request.reference' order by id desc limit 1"
      rule: db_order_legacy_rule.yaml
    - path: products
      name: check_product
      sql: "select id, amount, status from order_items where order_id='@id'"
      rule: db_product_rules_rule.yaml

  group:
    - wait: 3s
      dbcheck:
        name: check_order
        rule: order_ship.yaml
      callback: callback_ship.yaml

    - wait: 3s
      dbcheck:
        name: check_order
        rule: order_complete.yaml
      callback: callback_complete.yaml
