single_success:
  reference: "$ref(request.reference)"
  orderId: "$regex(^PX\\d+$)"
  name: "$ref(request.name)"
  orderDate: "$exists"
  amount: "$ref(request.amount)"
  currency: "$ref(request.currency)"
  status: "SUCCESS"
  cardNumber: "$regex(^\\d{6}\\*+\\d{4}$)"
  failReason: "$notExists"
  products: "$count(1)"
  products[0].productId: "$ref(request.products[0].productId)"
  products[0].count: "$ref(request.products[0].count)"
  products[0].spec: "$ref(request.products[0].spec)"
  products[0].status: "PROCESSING"

multiple_success:
  reference: "$ref(request.reference)"
  orderId: "$regex(^PX\\d+$)"
  name: "$ref(request.name)"
  orderDate: "$exists"
  amount: "$ref(request.amount)"
  currency: "$ref(request.currency)"
  status: "SUCCESS"
  cardNumber: "$regex(^\\d{6}\\*+\\d{4}$)"
  failReason: "$notExists"
  products: "$count(2)"
  products[0].productId: "$ref(request.products[0].productId)"
  products[0].count: "$ref(request.products[0].count)"
  products[0].spec: "$ref(request.products[0].spec)"
  products[0].status: "PROCESSING"
  products[1].productId: "$ref(request.products[1].productId)"
  products[1].count: "$ref(request.products[1].count)"
  products[1].spec: "$ref(request.products[1].spec)"
  products[1].status: "PROCESSING"

invalid_card:
  reference: "$ref(request.reference)"
  orderId: "$regex(^PX\\d+$)"
  name: "$ref(request.name)"
  orderDate: "$exists"
  amount: "$ref(request.amount)"
  currency: "$ref(request.currency)"
  status: "FAIL"
  failReason: "Unsupported card type"
  cardNumber: "$regex(^\\d{6}\\*+\\d{4}$)"
  products: "$count(1)"
  products[0].productId: "$ref(request.products[0].productId)"
  products[0].count: "$ref(request.products[0].count)"
  products[0].spec: "$ref(request.products[0].spec)"
  products[0].status: "FAIL"

duplicate_reference:
  status: "FAIL"
  failReason: "Order already exists"
